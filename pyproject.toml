[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-academy"
dynamic = ["version"]
description = "DevOps Academy — офлайн-курс DevOps Engineer с тестами и практикой"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "markdown>=3.11.1", "requests>=2.34.2"]

[project.scripts]
devops-academy = "devops_academy.main:run"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6.6", "build>=1.6.1", "pip-audit>=2.10.1", "PyYAML>=6.0.3"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
