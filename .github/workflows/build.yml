# Автосборка и выпуск версий.
#
# Как это работает:
#   1. Ветка main проходит проверки; версия рассчитывается по VERSION и истории коммитов.
#   2. До матричной сборки создаётся версионный commit в main. Его SHA используется всеми jobs.
#   3. Windows/Linux собирают артефакты из этого неизменяемого SHA; публикация создаёт только тег
#      и GitHub Release, не делает поздний push HEAD:main.
#   4. Ручной запуск с ref, отличным от main, пропускает guard и не публикует релиз.
#
# Ручной запуск: Actions -> Build & Release -> Run workflow из main (bump: none/patch/minor/major).
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Как поднять версию"
        type: choice
        options: [auto, none, patch, minor, major]
        default: auto

# Все автоматические и ручные релизы сериализованы в одной группе.
# Новая публикация не отменяет текущую; перед commit/tag выполняется повторная проверка main и тега.
concurrency:
  group: build-release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # На Windows вывод по умолчанию в cp1252 — русский текст в логах ломает шаги.
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  guard:
    name: Проверки перед сборкой
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      sha: ${{ steps.release_commit.outputs.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Разрешить публикацию только из main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Стабильный релиз собирается только из refs/heads/main (получено: $GITHUB_REF)" >&2
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Системные библиотеки Qt (Linux)
        # PySide6 требует libGL/libEGL/libxkbcommon/libdbus даже в offscreen-режиме.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements-dev.txt
      - name: Линтер (ruff)
        run: ruff check .
      - name: Тесты (pytest)
        # Через обёртку: пишет reports/pytest.log и оставляет аннотацию при провале.
        run: python tools/run_tests.py
      - name: Проверка контента
        run: python tools/validate_content.py
      - name: Определить версию релиза
        id: version
        shell: bash
        run: |
          # Логика покрыта тестами: tests/test_release_tools.py
          python tools/next_version.py \
            --bump "${{ github.event.inputs.bump || 'auto' }}" \
            --remote origin \
            >> "$GITHUB_OUTPUT"
          echo "Версия для релиза: $(grep '^version=' "$GITHUB_OUTPUT" | tail -1)"
      - name: Собрать release notes и запись в CHANGELOG
        if: steps.version.outputs.release == 'true'
        id: notes
        shell: bash
        run: |
          # Группировка коммитов и CHANGELOG — в инструменте, покрытом тестами.
          python tools/release_notes.py \
            --version "${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}"
          echo "--- release_notes.md ---"
          cat release_notes.md
          echo "--- CHANGELOG.md (начало) ---"
          head -40 CHANGELOG.md
      - name: Зафиксировать версию до сборки и опубликовать commit SHA
        id: release_commit
        shell: bash
        env:
          RELEASE: ${{ steps.version.outputs.release }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" != "true" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] || [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main изменился во время проверок; безопасно повторите workflow на свежем commit" >&2
            exit 1
          fi
          remote_tag=$(git ls-remote --tags origin "refs/tags/v$VERSION")
          if [ -n "$remote_tag" ]; then
            echo "Тег v$VERSION уже существует; дублирующая публикация отменена" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$VERSION" > VERSION
          python tools/generate_version.py --version "$VERSION" --build "$GITHUB_RUN_NUMBER"
          git add VERSION src/devops_academy/version.py content/content_index.json CHANGELOG.md
          git commit -m "chore(release): v$VERSION [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Сохранить release notes
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-meta
          path: release_notes.md
          retention-days: 3

  windows:
    name: Сборка для Windows
    needs: guard
    if: needs.guard.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить зависимости
        run: pip install -r requirements-dev.txt
      - name: Собрать приложение (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/devops_academy.spec
      - name: Проверить собранный exe
        shell: pwsh
        env:
          DEVOPS_ACADEMY_LOG: ${{ github.workspace }}\dist\self-test.log
        run: |
          # Важно: PowerShell не ждёт GUI-приложения (console=False) при вызове через &,
          # поэтому запускаем через Start-Process -Wait и смотрим ExitCode процесса.
          $out = "${{ github.workspace }}\dist\self-test.out"
          $err = "${{ github.workspace }}\dist\self-test.err"
          $proc = Start-Process -FilePath "dist\DevOpsAcademy\DevOpsAcademy.exe" `
            -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue
          if (Test-Path $env:DEVOPS_ACADEMY_LOG) { Get-Content $env:DEVOPS_ACADEMY_LOG }
          if ($proc.ExitCode -ne 0) { throw "self-test собранного приложения провалился: код $($proc.ExitCode)" }
      - name: Упаковать в ZIP
        shell: pwsh
        run: |
          $v = "${{ needs.guard.outputs.version }}"
          Compress-Archive -Path dist/DevOpsAcademy/* -DestinationPath "dist/DevOpsAcademy-$v-windows-x64.zip" -Force
      - name: Собрать установщик (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ needs.guard.outputs.version }}" "/DBuildNumber=${{ github.run_number }}" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "сборка установщика провалилась" }
          Get-ChildItem dist -Filter *.exe | Format-Table Name, Length
      - name: Загрузить артефакты
        uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: |
            dist/*.zip
            dist/*Setup*.exe
          retention-days: 14

  linux:
    name: Сборка для Linux
    needs: guard
    if: needs.guard.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Системные библиотеки Qt (Linux)
        # PySide6 требует libGL/libEGL/libxkbcommon/libdbus даже в offscreen-режиме.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements-dev.txt
      - name: Собрать приложение (PyInstaller)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller --noconfirm --clean packaging/devops_academy.spec
      - name: Проверить собранный бинарник
        env:
          DEVOPS_ACADEMY_LOG: ${{ github.workspace }}/dist/self-test.log
        run: |
          dist/DevOpsAcademy/DevOpsAcademy --self-test
          [ -f "$DEVOPS_ACADEMY_LOG" ] && cat "$DEVOPS_ACADEMY_LOG" || true
      - name: Упаковать в tar.gz
        run: |
          cd dist && tar czf "DevOpsAcademy-${{ needs.guard.outputs.version }}-linux-x64.tar.gz" DevOpsAcademy
      - uses: actions/upload-artifact@v7
        with:
          name: linux-dist
          path: dist/*.tar.gz
          retention-days: 14

  release:
    name: Публикация релиза
    needs: [guard, windows, linux]
    if: needs.guard.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Подготовить файлы релиза
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.guard.outputs.version }}"
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*Setup*.exe' \) -exec cp {} release/ \;
          cp artifacts/release-meta/release_notes.md release/RELEASE_NOTES.md

          # Метаданные для клиента: приложение читает этот файл и показывает уведомление.
          # Инструмент покрыт тестами (tests/test_release_tools.py).
          python tools/make_update_manifest.py --version "$VERSION" --repo "${{ github.repository }}" --dir release

          # Контрольные суммы — приложение проверяет их перед установкой обновления.
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - name: Создать тег и релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.guard.outputs.version }}"
          RELEASE_SHA="${{ needs.guard.outputs.sha }}"
          git fetch origin --tags
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "Платформенные сборки и публикация должны использовать один commit: $RELEASE_SHA" >&2
            exit 1
          fi
          remote_tag=$(git ls-remote --tags origin "refs/tags/v$VERSION")
          if git show-ref --verify --quiet "refs/tags/v$VERSION" || [ -n "$remote_tag" ]; then
            echo "Тег v$VERSION уже существует; дублирующая публикация отменена" >&2
            exit 1
          fi
          # Создаём тег и Release через GitHub API на проверенном SHA;
          # так тег не зависит от отдельного git push из runner.
          gh release create "v$VERSION" release/* \
            --title "DevOps Academy $VERSION" \
            --notes-file release/RELEASE_NOTES.md \
            --target "$RELEASE_SHA" \
            --latest
      - name: Итог сборки
        run: |
          {
            echo "### Релиз v${{ needs.guard.outputs.version }} опубликован :rocket:"
            echo
            echo "Клиенты получат уведомление автоматически: приложение проверяет"
            echo "https://api.github.com/repos/${{ github.repository }}/releases/latest"
            echo "и показывает баннер с описанием изменений."
            echo
            echo "| Файл | Назначение |"
            echo "| --- | --- |"
            echo "| DevOpsAcademy-Setup-*.exe | установщик для Windows |"
            echo "| DevOpsAcademy-*-windows-x64.zip | портативная версия |"
            echo "| DevOpsAcademy-*-linux-x64.tar.gz | сборка для Linux |"
            echo "| SHA256SUMS.txt | контрольные суммы |"
            echo "| update.json | метаданные для автообновления |"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Уведомление клиентов
    needs: [guard, release]
    if: needs.guard.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Отправить уведомление в вебхук (если настроен)
        env:
          WEBHOOK: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: |
          VERSION="${{ needs.guard.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::RELEASE_WEBHOOK_URL не задан — уведомление только через GitHub Releases"
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" -H 'Content-Type: application/json' \
            -d "{\"text\":\"DevOps Academy $VERSION опубликован: $URL\"}" > /dev/null
          echo "Уведомление отправлено"
      - name: Сводка в Actions
        run: |
          {
            echo "### Уведомление о новой версии"
            echo
            echo "- В приложении: баннер «Доступна новая версия» + диалог с release notes."
            echo "- В канале команды: сообщение через RELEASE_WEBHOOK_URL (Slack/Discord/Teams)."
            echo "- Для подписчиков: GitHub Watch → Releases."
          } >> "$GITHUB_STEP_SUMMARY"
