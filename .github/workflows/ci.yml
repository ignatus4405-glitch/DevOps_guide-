# Проверка качества: контент, линтер, тесты, дымовой тест GUI.
# Запускается на каждый push и pull request, чтобы сломанное изменение не попало в релиз.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # На Windows вывод по умолчанию в cp1252 — русский текст в логах ломает шаги.
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  content:
    name: Контент курса
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить зависимости
        run: pip install -r requirements-dev.txt
      - name: Проверить структуру контента
        run: python tools/validate_content.py
      - name: Обновить index и убедиться, что он актуален
        run: |
          mkdir -p reports
          python tools/generate_version.py --version "$(cat VERSION)" --build "${{ github.run_number }}"
          if ! git diff --exit-code -- content/content_index.json; then
            echo "::warning title=content_index.json устарел::Запустите python tools/generate_version.py и закоммитьте результат"
          fi

  package-wheel:
    name: Wheel и встроенный курс
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Собрать wheel
        run: |
          python -m pip install build==1.6.1
          python -m build --wheel --outdir dist
      - name: Проверить состав и версию wheel
        run: python tools/check_wheel_content.py dist/*.whl
      - name: Установить wheel вне checkout и загрузить курс
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-site" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/wheel-site" python - <<'PY'
          from devops_academy.content import Course
          from devops_academy.paths import content_dir

          course = Course.load(content_dir())
          assert course.stats()["lessons"] > 0
          print(f"installed wheel loaded {course.stats()['lessons']} lessons from {content_dir()}")
          PY

  test:
    name: Тесты (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Системные библиотеки Qt (Linux)
        if: runner.os == 'Linux'
        # PySide6 требует libGL/libEGL/libxkbcommon/libdbus даже в offscreen-режиме.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Установить зависимости
        run: pip install -r requirements-dev.txt
      - name: Аудит runtime-зависимостей
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Линтер (ruff)
        run: ruff check .
      - name: Тесты (pytest)
        # Запуск через Python: одинаково работает в Linux и Windows, пишет
        # reports/pytest.log + reports/pytest.xml и на провале печатает аннотацию
        # (её видно в проверках, даже если сервис логов недоступен).
        run: python tools/run_tests.py
      - name: Дымовой тест приложения
        run: python tools/smoke_test.py
      - name: Проверка режима --self-test
        run: python run.py --self-test
      - name: Артефакты отчётов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}
          path: |
            reports/
            .pytest_cache/
          if-no-files-found: ignore
          retention-days: 7

  policy-examples:
    name: Conftest / OPA Rego v1 примеры
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить закреплённую версию Conftest
        shell: bash
        run: |
          set -euo pipefail
          version=0.71.1
          archive="conftest_${version}_Linux_x86_64.tar.gz"
          base="https://github.com/open-policy-agent/conftest/releases/download/v${version}"
          curl -fsSL "$base/$archive" -o "$RUNNER_TEMP/$archive"
          mkdir -p "$RUNNER_TEMP/conftest"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/conftest" conftest
          "$RUNNER_TEMP/conftest/conftest" --version
      - name: Прогнать allow/deny планы Terraform
        shell: bash
        run: |
          set -euo pipefail
          conftest="$RUNNER_TEMP/conftest/conftest"

          expect_case() {
            local expected="$1" label="$2" output status=0 detail
            shift 2
            output=$("$conftest" "$@" 2>&1) || status=$?
            printf '%s\n' "$output"
            if [[ "$expected" == "pass" ]]; then
              if (( status == 0 )); then return 0; fi
            elif (( status != 0 )) && [[ "$output" == *"$expected"* ]]; then
              return 0
            fi
            detail=${output//'%'/'%25'}
            detail=${detail//$'\r'/}
            detail=${detail//$'\n'/'%0A'}
            echo "::error title=Conftest $label::$detail"
            return 1
          }

          policy=content/modules/08-iac/examples/policy
          expect_case pass "safe Terraform plan" test "$policy/plan-safe.json" --policy "$policy" --namespace terraform
          expect_case "SSH открыт в интернет" "public SSH denial" test "$policy/plan-public-ssh.json" --policy "$policy" --namespace terraform

          tags=content/modules/08-iac/examples/tags
          expect_case pass "Terraform resource with owner" test "$tags/plan-with-owner.json" --policy "$tags" --namespace main
          expect_case "без owner" "missing owner denial" test "$tags/plan-without-owner.json" --policy "$tags" --namespace main

  windows-gui:
    name: GUI-тесты на Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Прогон GUI-тестов в offscreen-режиме
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_ui_smoke.py -q
