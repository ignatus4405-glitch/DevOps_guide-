name: win-diag
# временный workflow: повторная проверка тестов на Windows после правок
on:
  push:
    branches: [arena/f33a7a3a-devops-guide]
    paths: [".github/workflows/zz-win-diag.yml"]
permissions:
  contents: read
  statuses: write
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: probe-annotation-ascii
        run: python -c "print('::error title=win-probe::ascii-ok')"
      - name: probe-commit-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context=win-probe -f description="win-probe ok"
      - name: run-test_content.py
        if: always()
        run: python tools/run_tests.py --pytest-args "tests/test_content.py"
      - name: run-test_launcher.py
        if: always()
        run: python tools/run_tests.py --pytest-args "tests/test_launcher.py"
      - name: run-test_markdown.py
        if: always()
        run: python tools/run_tests.py --pytest-args "tests/test_markdown.py"
      - name: run-test_progress.py
        if: always()
        run: python tools/run_tests.py --pytest-args "tests/test_progress.py"
      - name: run-test_release_notes.py
        if: always()
        run: python tools/run_tests.py --pytest-args "tests/test_release_notes.py"
      - name: run-test_release_tools.py
        if: always()
        run: python tools/run_tests.py --pytest-args "tests/test_release_tools.py"
      - name: run-test_run_tests.py
        if: always()
        run: python tools/run_tests.py --pytest-args "tests/test_run_tests.py"
      - name: run-test_task_checker.py
        if: always()
        run: python tools/run_tests.py --pytest-args "tests/test_task_checker.py"
      - name: run-test_ui_smoke.py
        if: always()
        run: python tools/run_tests.py --pytest-args "tests/test_ui_smoke.py"
      - name: run-test_updater.py
        if: always()
        run: python tools/run_tests.py --pytest-args "tests/test_updater.py"
      - name: run-test_version_tooling.py
        if: always()
        run: python tools/run_tests.py --pytest-args "tests/test_version_tooling.py"
