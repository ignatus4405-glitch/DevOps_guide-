<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Стратегии деплоя">
<rect width="900" height="470" rx="14" fill="#0f172a"/>
<title>Стратегии деплоя</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa3bf"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9cf9"/></marker></defs>
<text x="450" y="34" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="17" font-weight="700" fill="#e6edf7">Как выпускать изменения без простоя</text>
<rect x="40" y="80" width="200" height="140" rx="12" fill="#1d3557" stroke="#4f9cf9" stroke-width="1.5"/>
<text x="140.0" y="106" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Rolling update</text>
<text x="140.0" y="126" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">по умолчанию в k8s</text>
<text x="140.0" y="143" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">простой = 0 при readiness</text>
<text x="140.0" y="160" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">откат: kubectl rollout undo</text>
<rect x="255" y="80" width="200" height="140" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="355.0" y="106" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Blue / Green</text>
<text x="355.0" y="126" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">два окружения</text>
<text x="355.0" y="143" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">переключение трафика</text>
<text x="355.0" y="160" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">мгновенный откат</text>
<rect x="470" y="80" width="200" height="140" rx="12" fill="#4a2f12" stroke="#f0b429" stroke-width="1.5"/>
<text x="570.0" y="106" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Canary</text>
<text x="570.0" y="126" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">1-5-25-100% трафика</text>
<text x="570.0" y="143" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">сравнение метрик</text>
<text x="570.0" y="160" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">автооткат по SLO</text>
<rect x="685" y="80" width="200" height="140" rx="12" fill="#2c2148" stroke="#b18cff" stroke-width="1.5"/>
<text x="785.0" y="106" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Feature flags</text>
<text x="785.0" y="126" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">код уже в проде</text>
<text x="785.0" y="143" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">включение по группам</text>
<text x="785.0" y="160" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">без релиза</text>
<rect x="40" y="250" width="400" height="180" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="240.0" y="276" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Что делает релиз безопасным</text>
<text x="240.0" y="296" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">миграции БД обратно совместимы (expand/contract)</text>
<text x="240.0" y="313" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">фича за флагом, если риск высок</text>
<text x="240.0" y="330" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">проверка health и smoke-тестов после выката</text>
<text x="240.0" y="347" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">наблюдаемость до релиза, а не после</text>
<text x="240.0" y="364" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">один ответственный за релиз и окно времени</text>
<rect x="460" y="250" width="400" height="180" rx="12" fill="#4a1f1f" stroke="#f2635f" stroke-width="1.5"/>
<text x="660.0" y="276" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Признаки проблемного процесса</text>
<text x="660.0" y="296" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">релиз раз в месяц большого объёма</text>
<text x="660.0" y="313" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">ручные шаги «по инструкции в wiki»</text>
<text x="660.0" y="330" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">нет отката — только «чинить вперёд»</text>
<text x="660.0" y="347" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">никто не знает, что именно задеплоено</text>
<text x="660.0" y="364" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">тесты после выката вместо до</text>
</svg>
