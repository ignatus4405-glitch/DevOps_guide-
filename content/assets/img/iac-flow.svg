<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Инфраструктура как код">
<rect width="900" height="470" rx="14" fill="#0f172a"/>
<title>Инфраструктура как код</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa3bf"/></marker></defs>
<text x="450" y="34" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="17" font-weight="700" fill="#e6edf7">IaC: Terraform создаёт ресурсы, Ansible настраивает</text>
<rect x="60" y="90" width="220" height="110" rx="12" fill="#1d3557" stroke="#4f9cf9" stroke-width="1.5"/>
<text x="170.0" y="116" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Код в Git</text>
<text x="170.0" y="136" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">main.tf, playbook.yml</text>
<text x="170.0" y="153" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">ревью и версии</text>
<rect x="340" y="90" width="220" height="110" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="450.0" y="116" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">CI: plan</text>
<text x="450.0" y="136" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">terraform plan</text>
<text x="450.0" y="153" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">линтеры, tflint</text>
<rect x="620" y="90" width="220" height="110" rx="12" fill="#4a2f12" stroke="#f0b429" stroke-width="1.5"/>
<text x="730.0" y="116" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Apply</text>
<text x="730.0" y="136" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">создание облака</text>
<text x="730.0" y="153" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">идемпотентно</text>
<line x1="285" y1="145" x2="335" y2="145" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="565" y1="145" x2="615" y2="145" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60" y="250" width="380" height="180" rx="12" fill="#1d3557" stroke="#4f9cf9" stroke-width="1.5"/>
<text x="250.0" y="276" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Terraform: модель состояния</text>
<text x="250.0" y="296" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">state хранит карту «код ↔ реальность»</text>
<text x="250.0" y="313" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">remote backend + блокировка (S3+DynamoDB) — командная работа</text>
<text x="250.0" y="330" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">terraform plan перед каждым apply</text>
<text x="250.0" y="347" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">модули для повторно используемых ресурсов</text>
<text x="250.0" y="364" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">секреты — не в коде, а в переменных окружения</text>
<rect x="470" y="250" width="380" height="180" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="660.0" y="276" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Ansible: конфигурация узлов</text>
<text x="660.0" y="296" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">inventory: какие хосты настраиваем</text>
<text x="660.0" y="313" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">playbook + roles, YAML и Jinja2</text>
<text x="660.0" y="330" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">идемпотентность: повторный запуск безопасен</text>
<text x="660.0" y="347" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">check mode: ansible-playbook --check</text>
<text x="660.0" y="364" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">ansible-vault для секретов</text>
</svg>
