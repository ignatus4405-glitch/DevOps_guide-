<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Сетевая модель и диагностика">
<rect width="900" height="520" rx="14" fill="#0f172a"/>
<title>Сетевая модель и диагностика</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa3bf"/></marker></defs>
<text x="450" y="34" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="17" font-weight="700" fill="#e6edf7">Стек TCP/IP и инструменты диагностики</text>
<rect x="60" y="80" width="300" height="78" rx="12" fill="#1d3557" stroke="#4f9cf9" stroke-width="1.5"/>
<text x="210.0" y="106" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Прикладной</text>
<text x="210.0" y="126" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">HTTP, DNS, TLS</text>
<rect x="400" y="80" width="440" height="78" rx="12" fill="#1d3557" stroke="#4f9cf9" stroke-width="1.5"/>
<text x="620.0" y="106" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">curl -v, dig, openssl s_client</text>
<text x="620.0" y="126" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc"></text>
<text x="620" y="132" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#9fb0cc">инструмент диагностики этого уровня</text>
<rect x="60" y="172" width="300" height="78" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="210.0" y="198" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Транспортный</text>
<text x="210.0" y="218" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">TCP, UDP, порты</text>
<rect x="400" y="172" width="440" height="78" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="620.0" y="198" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">ss -tulpn, nc -vz, tcpdump</text>
<text x="620.0" y="218" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc"></text>
<text x="620" y="224" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#9fb0cc">инструмент диагностики этого уровня</text>
<rect x="60" y="264" width="300" height="78" rx="12" fill="#4a2f12" stroke="#f0b429" stroke-width="1.5"/>
<text x="210.0" y="290" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Сетевой</text>
<text x="210.0" y="310" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">IP, маршрутизация, ICMP</text>
<rect x="400" y="264" width="440" height="78" rx="12" fill="#4a2f12" stroke="#f0b429" stroke-width="1.5"/>
<text x="620.0" y="290" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">ip a, ip r, ping, traceroute</text>
<text x="620.0" y="310" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc"></text>
<text x="620" y="316" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#9fb0cc">инструмент диагностики этого уровня</text>
<rect x="60" y="356" width="300" height="78" rx="12" fill="#2c2148" stroke="#b18cff" stroke-width="1.5"/>
<text x="210.0" y="382" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Канальный</text>
<text x="210.0" y="402" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">Ethernet, ARP, MAC</text>
<rect x="400" y="356" width="440" height="78" rx="12" fill="#2c2148" stroke="#b18cff" stroke-width="1.5"/>
<text x="620.0" y="382" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">ip link, arp -a</text>
<text x="620.0" y="402" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc"></text>
<text x="620" y="408" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#9fb0cc">инструмент диагностики этого уровня</text>
<text x="450" y="460" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="13" font-weight="700" fill="#9fb0cc">Порядок разбора проблемы: DNS → порт → TLS → приложение → логи</text>
<text x="450" y="485" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#9fb0cc">curl -v https://api.example.com  показывает каждый шаг соединения</text>
</svg>
