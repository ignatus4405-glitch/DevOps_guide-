<path d="M 736 232 Q 757 240 754 253" fill="none" stroke="#a9bcd6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 754 347 Q 757 360 736 368" fill="none" stroke="#a9bcd6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 594 434 Q 577 444 550 442" fill="none" stroke="#a9bcd6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 442 Q 323 444 306 434" fill="none" stroke="#a9bcd6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 164 368 Q 143 360 146 347" fill="none" stroke="#a9bcd6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 146 253 Q 143 240 164 232" fill="none" stroke="#a9bcd6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 250 156 C 270 94 336 90 362 130" fill="none" stroke="#4f9cf9" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-accent)"/>
<rect x="290" y="257" width="320" height="86" rx="12" fill="#0f172a" stroke="#26375c" stroke-width="1.2"/>
<text x="450.0" y="287" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="14" font-weight="700" fill="#e6edf7">Feedback loop</text>
<text x="450.0" y="309" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#9fb0cc">наблюдения возвращаются в планирование</text>
<text x="450.0" y="327" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#9fb0cc">и меняют бэклог следующей итерации</text>
<text x="450" y="516" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="13" font-weight="700" fill="#9fb0cc">Чем короче петля и быстрее обратная связь, тем дешевле изменения и надёжнее продукт</text>
<text x="450" y="538" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#9fb0cc">Метрики скорости петли: lead time, deployment frequency, MTTR, change failure rate (DORA)</text>
</svg>
