<text x="770.0" y="292" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Сборка</text>
<text x="770.0" y="312" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">CI-пайплайн</text>
<rect x="592" y="372" width="168" height="68" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="676.0" y="398" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Тестирование</text>
<text x="676.0" y="418" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">unit, e2e</text>
<rect x="366" y="416" width="168" height="68" rx="12" fill="#4a2f12" stroke="#f0b429" stroke-width="1.5"/>
<text x="450.0" y="442" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Релиз</text>
<text x="450.0" y="462" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">артефакты, теги</text>
<rect x="140" y="372" width="168" height="68" rx="12" fill="#4a2f12" stroke="#f0b429" stroke-width="1.5"/>
<text x="224.0" y="398" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Деплой</text>
<text x="224.0" y="418" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">staging, prod</text>
