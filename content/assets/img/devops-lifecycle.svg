<text x="130.0" y="292" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Эксплуатация</text>
<text x="130.0" y="312" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">SRE, алерты</text>
<rect x="140" y="160" width="168" height="68" rx="12" fill="#2c2148" stroke="#b18cff" stroke-width="1.5"/>
<text x="224.0" y="186" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Мониторинг</text>
<text x="224.0" y="206" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">SLI/SLO, логи</text>
