<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Жизненный цикл DevOps">
<rect width="900" height="560" rx="14" fill="#0f172a"/>
<title>Жизненный цикл DevOps</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa3bf"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9cf9"/></marker></defs>
<text x="450" y="34" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="17" font-weight="700" fill="#e6edf7">Жизненный цикл DevOps: бесконечная петля</text>
<path d="M 770 300 A 320 150 0 1 0 130 300 A 320 150 0 1 0 770 300" fill="none" stroke="#1d2c47" stroke-width="10"/>
<path d="M 770 300 A 320 150 0 1 0 130 300 A 320 150 0 1 0 770 300" fill="none" stroke="#3b5170" stroke-width="1.2" stroke-dasharray="4 8"/>
