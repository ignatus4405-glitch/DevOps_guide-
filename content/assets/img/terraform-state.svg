<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Состояние Terraform">
<rect width="900" height="440" rx="14" fill="#0f172a"/>
<title>Состояние Terraform</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa3bf"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9cf9"/></marker></defs>
<text x="450" y="34" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="17" font-weight="700" fill="#e6edf7">Код, state и реальная инфраструктура</text>
<rect x="50" y="80" width="220" height="110" rx="12" fill="#1d3557" stroke="#4f9cf9" stroke-width="1.5"/>
<text x="160.0" y="106" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Конфигурация</text>
<text x="160.0" y="126" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">main.tf, модули</text>
<text x="160.0" y="143" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">желаемое состояние</text>
<rect x="340" y="80" width="220" height="110" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="450.0" y="106" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">State</text>
<text x="450.0" y="126" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">карта ресурс → ID</text>
<text x="450.0" y="143" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">секреты и атрибуты</text>
<rect x="630" y="80" width="220" height="110" rx="12" fill="#4a2f12" stroke="#f0b429" stroke-width="1.5"/>
<text x="740.0" y="106" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Облако</text>
<text x="740.0" y="126" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">реальные ресурсы</text>
<text x="740.0" y="143" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">фактическое состояние</text>
<line x1="275" y1="110" x2="335" y2="110" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="565" y1="110" x2="625" y2="110" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="275" y1="160" x2="335" y2="160" stroke="#8fa3bf" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<line x1="565" y1="160" x2="625" y2="160" stroke="#8fa3bf" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="450" y="220" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="13" font-weight="400" fill="#9fb0cc">plan сравнивает три источника и показывает разницу</text>
<rect x="50" y="250" width="380" height="150" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="240.0" y="276" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Remote backend</text>
<text x="240.0" y="296" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">S3 + DynamoDB / Terraform Cloud</text>
<text x="240.0" y="313" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">блокировка от параллельных apply</text>
<text x="240.0" y="330" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">версионирование и шифрование</text>
<text x="240.0" y="347" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">state не хранится в Git</text>
<rect x="470" y="250" width="380" height="150" rx="12" fill="#1d3557" stroke="#4f9cf9" stroke-width="1.5"/>
<text x="660.0" y="276" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Гигиена состояния</text>
<text x="660.0" y="296" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">terraform state list — что управляется</text>
<text x="660.0" y="313" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">state mv — перенос без пересоздания</text>
<text x="660.0" y="330" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">state rm — перестать управлять</text>
<text x="660.0" y="347" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">перед изменениями — резервная копия</text>
</svg>
