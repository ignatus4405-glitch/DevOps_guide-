<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Сеть в Kubernetes">
<rect width="900" height="470" rx="14" fill="#0f172a"/>
<title>Сеть в Kubernetes</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa3bf"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9cf9"/></marker></defs>
<text x="450" y="34" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="17" font-weight="700" fill="#e6edf7">Путь запроса: клиент → Ingress → Service → Pod</text>
<rect x="40" y="90" width="180" height="90" rx="12" fill="#222c3d" stroke="#8fa3bf" stroke-width="1.5"/>
<text x="130.0" y="116" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Клиент</text>
<text x="130.0" y="136" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">HTTPS</text>
<text x="130.0" y="153" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">внешний трафик</text>
<rect x="260" y="90" width="180" height="90" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="350.0" y="116" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Ingress</text>
<text x="350.0" y="136" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">TLS, маршруты</text>
<text x="350.0" y="153" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">правила по host/path</text>
<rect x="480" y="90" width="180" height="90" rx="12" fill="#1d3557" stroke="#4f9cf9" stroke-width="1.5"/>
<text x="570.0" y="116" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Service</text>
<text x="570.0" y="136" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">ClusterIP</text>
<text x="570.0" y="153" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">выбор подов по labels</text>
<rect x="700" y="90" width="160" height="90" rx="12" fill="#2c2148" stroke="#b18cff" stroke-width="1.5"/>
<text x="780.0" y="116" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Поды</text>
<text x="780.0" y="136" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">readiness gate</text>
<text x="780.0" y="153" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">порт контейнера</text>
<line x1="225" y1="135" x2="255" y2="135" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="445" y1="135" x2="475" y2="135" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="665" y1="135" x2="695" y2="135" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="240" width="250" height="130" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="165.0" y="266" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">CoreDNS</text>
<text x="165.0" y="286" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">service.namespace.svc</text>
<text x="165.0" y="303" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">резолвит имена сервисов</text>
<text x="165.0" y="320" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">проверка: nslookup api</text>
<rect x="320" y="240" width="250" height="130" rx="12" fill="#1d3557" stroke="#4f9cf9" stroke-width="1.5"/>
<text x="445.0" y="266" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">kube-proxy</text>
<text x="445.0" y="286" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">iptables/IPVS правила</text>
<text x="445.0" y="303" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">балансировка на поды</text>
<text x="445.0" y="320" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">endpoints обновляются</text>
<rect x="600" y="240" width="260" height="130" rx="12" fill="#4a2f12" stroke="#f0b429" stroke-width="1.5"/>
<text x="730.0" y="266" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">NetworkPolicy</text>
<text x="730.0" y="286" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">default deny в namespace</text>
<text x="730.0" y="303" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">явные allow-правила</text>
<text x="730.0" y="320" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">проверка: kubectl describe netpol</text>
<text x="450" y="405" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="13" font-weight="400" fill="#9fb0cc">DNS-имя сервиса стабильно, IP подов меняется при каждом пересоздании</text>
<text x="450" y="430" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="13" font-weight="400" fill="#9fb0cc">Отладка: kubectl get endpoints, kubectl exec -- nslookup, kubectl describe netpol</text>
</svg>
