<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Файловая система Linux">
<rect width="900" height="520" rx="14" fill="#0f172a"/>
<title>Файловая система Linux</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa3bf"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9cf9"/></marker></defs>
<text x="450" y="34" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="17" font-weight="700" fill="#e6edf7">Иерархия файловой системы (FHS)</text>
<rect x="360" y="60" width="180" height="58" rx="12" fill="#1d3557" stroke="#4f9cf9" stroke-width="1.5"/>
<text x="450.0" y="86" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">/</text>
<text x="450.0" y="106" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">корень файловой системы</text>
<rect x="40" y="180" width="95" height="76" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="87.5" y="206" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">/etc</text>
<text x="87.5" y="226" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">конфиги</text>
<text x="87.5" y="243" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">nginx.conf</text>
<line x1="450" y1="118" x2="87" y2="176" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="145" y="180" width="95" height="76" rx="12" fill="#12402f" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="192.5" y="206" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">/var</text>
<text x="192.5" y="226" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">логи, кэш</text>
<text x="192.5" y="243" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">/var/log</text>
<line x1="450" y1="118" x2="192" y2="176" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="250" y="180" width="95" height="76" rx="12" fill="#1d3557" stroke="#4f9cf9" stroke-width="1.5"/>
<text x="297.5" y="206" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">/home</text>
<text x="297.5" y="226" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">данные</text>
<text x="297.5" y="243" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">пользов.</text>
<line x1="450" y1="118" x2="297" y2="176" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="355" y="180" width="95" height="76" rx="12" fill="#1d3557" stroke="#4f9cf9" stroke-width="1.5"/>
<text x="402.5" y="206" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">/usr</text>
<text x="402.5" y="226" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">бинарники</text>
<text x="402.5" y="243" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">/usr/bin</text>
<line x1="450" y1="118" x2="402" y2="176" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="460" y="180" width="95" height="76" rx="12" fill="#2c2148" stroke="#b18cff" stroke-width="1.5"/>
<text x="507.5" y="206" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">/opt</text>
<text x="507.5" y="226" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">сторонний</text>
<text x="507.5" y="243" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">софт</text>
<line x1="450" y1="118" x2="507" y2="176" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="565" y="180" width="95" height="76" rx="12" fill="#4a2f12" stroke="#f0b429" stroke-width="1.5"/>
<text x="612.5" y="206" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">/tmp</text>
<text x="612.5" y="226" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">временные</text>
<text x="612.5" y="243" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">файлы</text>
<line x1="450" y1="118" x2="612" y2="176" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="670" y="180" width="95" height="76" rx="12" fill="#2c2148" stroke="#b18cff" stroke-width="1.5"/>
<text x="717.5" y="206" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">/proc</text>
<text x="717.5" y="226" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">виртуальная</text>
<text x="717.5" y="243" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">ФС: процессы</text>
<line x1="450" y1="118" x2="717" y2="176" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="775" y="180" width="95" height="76" rx="12" fill="#222c3d" stroke="#8fa3bf" stroke-width="1.5"/>
<text x="822.5" y="206" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">/dev</text>
<text x="822.5" y="226" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">устройства</text>
<text x="822.5" y="243" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">диски</text>
<line x1="450" y1="118" x2="822" y2="176" stroke="#8fa3bf" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="450" y="300" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#9fb0cc">Правило DevOps-инженера: конфиги (/etc) и данные (/var, /home) живут отдельно от кода (/opt, /usr/local)</text>
<rect x="90" y="350" width="330" height="130" rx="12" fill="#4a2f12" stroke="#f0b429" stroke-width="1.5"/>
<text x="255.0" y="376" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Где смотреть диагностику</text>
<text x="255.0" y="396" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">/var/log/syslog, journalctl</text>
<text x="255.0" y="413" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">/var/log/nginx/error.log</text>
<text x="255.0" y="430" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">/proc/cpuinfo, /proc/meminfo</text>
<text x="255.0" y="447" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">df -h, du -sh, mount</text>
<rect x="480" y="350" width="330" height="130" rx="12" fill="#4a1f1f" stroke="#f2635f" stroke-width="1.5"/>
<text x="645.0" y="376" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Что важно не трогать</text>
<text x="645.0" y="396" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">rm -rf / — уничтожает систему</text>
<text x="645.0" y="413" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">chmod 777 на /etc — дыра в безопасности</text>
<text x="645.0" y="430" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">правки бинарников в /usr/bin</text>
<text x="645.0" y="447" text-anchor="middle" font-family="'Segoe UI','Inter','Noto Sans',sans-serif" font-size="12" fill="#9fb0cc">заполненный / или /var — падение сервисов</text>
</svg>
